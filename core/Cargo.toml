[package]
name = "fotema_core"
version = "0.1.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
chrono = "0.4.45"
fast_image_resize = { version = "6.1.0", features = ["image"] }
ffmpeg-next = "9.0.0"
gdk4 = "0.11.5"
gio = "0.22.10"
glycin = { version = "4.0.5", features = ["gdk4"] }
h3o = "0.11.1"
image = "0.25.10"
kamadak-exif = "0.6.2"
ndarray = "0.17.2"
rayon = "1.11.0"
refinery = { version = "0.10.0", features = ["rusqlite"] }
rusqlite = { version = "0.40.2", features = ["bundled", "chrono"] }
rust-faces = {git = "https://github.com/blissd/fotema-rust-faces.git", rev = "0bf0080431b7614c739014830a4eac16fae31b58", features = ["viz"]}
sm_motion_photo = "0.1.6"
strum = { version = "0.28", features = ["derive"] }
tempfile = "3.27.0"
tracing = "0.1.44"
walkdir = "2.5.0"
opencv = {version = "0.102.0", default-features = false, features = ["clang-runtime", "features2d", "objdetect", "imgcodecs", "dnn"]}
itertools = "0.14.0"
reqwest = { version = "0.13.5", features = ["blocking"] }
futures = "0.3.34"
url = "2.5.8"
md5 = "0.8.1"
# The model downloader checks each downloaded model file with SHA-256. Thus a
# truncated or corrupt file never stays in the cache.
sha2 = "0.10.9"
thiserror = "2.0.20"
byteorder = "1.5.0"
video-rs = {version = "0.12", features = ["ndarray"]}
quick-xml = "0.37.5"
# The CLIP smart search uses `ort`. The crate rust-faces already includes `ort`.
# The Flatpak contains the onnxruntime library, and src/main.rs finds it with
# ORT_DYLIB_PATH. Hold `ort` at the version that rust-faces selects. Then the build
# links only one copy of `ort`. Use `load-dynamic` to load the library from the
# Flatpak. Set default-features to false to prevent `download-binaries`. That
# feature downloads onnxruntime during the build.
# The feature `webgpu` gives the WebGPU execution provider. This provider uses Dawn
# with Vulkan, Metal or D3D. Thus one build can use an Intel, AMD, NVIDIA or ARM
# GPU. The onnxruntime library must also contain the provider.
# From rc.13 each execution provider structure, for example `ep::CUDA`, has its
# own feature. Thus you must list here each execution provider that clip.rs uses.
# With `load-dynamic` a feature controls only the Rust API. The build does not need
# a CUDA or CoreML SDK. If the onnxruntime library does not contain an execution
# provider, the application ignores it and uses the CPU.
ort = { version = "=2.0.0-rc.14", default-features = false, features = ["load-dynamic", "webgpu", "cuda", "coreml"] }
# The CLIP text encoder uses this tokenizer. The crate is pure Rust. Set
# default-features to false to remove the C and C++ dependencies onig, esaxx_fast
# and progressbar. The feature `fancy-regex` gives a regular expression engine in
# pure Rust. The crate needs this engine or the C library onig. The functions
# from_file and encode need no other feature.
tokenizers = { version = "0.21", default-features = false, features = ["fancy-regex"] }
